<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guitarra - Guia de Estudo</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="page">

  <header class="cover">
    <div class="staff"><span></span><span></span><span></span><span></span><span></span></div>
    <div class="eyebrow"><a href="index.html">Página inicial</a> · <a href="cavaquinho.html">Cavaquinho</a> · <a href="bandolim.html">Bandolim</a> · <span class="is-current">Guitarra</span></div>
    <div class="toc-separator" aria-hidden="true"></div>
    <h1 style="margin-top: 28px;">Página em construção</h1>
    <div class="toc-separator" aria-hidden="true"></div>
  </header>

  <button id="quickNavToggle" class="quick-nav-toggle visible mobile-only" type="button" aria-expanded="false" aria-controls="quickNavPanel" aria-label="Abrir índice de secções">☰</button>
  <div id="quickNavPanel" class="quick-nav-panel mobile-only" hidden>
    <div class="quick-nav-pages" role="group" aria-label="Navegação">
      <a href="index.html" class="quick-nav-page-btn">Página inicial</a>
      <a href="cavaquinho.html" class="quick-nav-page-btn">Cavaquinho</a>
      <a href="bandolim.html" class="quick-nav-page-btn">Bandolim</a>
      <a href="#" class="quick-nav-page-btn">Guitarra</a>
    </div>
  </div>

  <footer>Feito por Carolina Mezes - Coimbra, agosto de 2026.<br>Utilizado material de apoio feito por Beatriz Ormonde e Daniel Madeira - Coimbra, Março de 2024</footer>
</div>

<script>
(function(){
  var toggle = document.getElementById('quickNavToggle');
  var panel = document.getElementById('quickNavPanel');
  var STORAGE_KEY = 'quickNavOpen';
  function openQuickNav(){
    panel.hidden = false;
    toggle.setAttribute('aria-expanded', 'true');
  }
  function closeQuickNav(){
    panel.hidden = true;
    toggle.setAttribute('aria-expanded', 'false');
    sessionStorage.removeItem(STORAGE_KEY);
  }
  toggle.addEventListener('click', function(e){
    e.stopPropagation();
    if (panel.hidden) { sessionStorage.setItem(STORAGE_KEY, '1'); openQuickNav(); } else { closeQuickNav(); }
  });
  document.addEventListener('click', function(e){
    if (!panel.hidden && !panel.contains(e.target) && e.target !== toggle) closeQuickNav();
  });
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape') closeQuickNav();
  });
  // mantém o menu aberto ao navegar para outra página pelo próprio menu
  panel.querySelectorAll('a[href$=".html"]').forEach(function(link){
    link.addEventListener('click', function(){ sessionStorage.setItem(STORAGE_KEY, '1'); });
  });
  if (sessionStorage.getItem(STORAGE_KEY) === '1') { openQuickNav(); }
})();
</script>
</body>
</html>
